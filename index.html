<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1976D2">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="透析日记">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <title>血液透析日记</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/chart.umd.min.js" defer></script>
</head>
<body>
    <!-- 顶部标题栏 -->
    <header class="app-header">
        <h1>血液透析日记</h1>
        <button id="installBtn" class="install-btn hidden" aria-label="安装应用">安装</button>
    </header>

    <!-- 主内容区 -->
    <main id="app">

        <!-- Tab 1: 透析记录 -->
        <section id="tab-records" class="tab-page active">
            <!-- 干体重设置（只需设置一次） -->
            <div class="card dry-weight-card">
                <h2 class="card-title">干体重设置</h2>
                <p class="dry-weight-hint">干体重只需设置一次，后续自动带出用于计算涨水率</p>
                <div class="dry-weight-row">
                    <input type="number" id="dryWeight" step="0.1" min="20" max="200" placeholder="如: 60.0" inputmode="decimal">
                    <span class="dry-weight-unit">kg</span>
                    <button type="button" id="saveDryWeightBtn" class="btn-primary">保存</button>
                </div>
                <div id="dryWeightDisplay" class="dry-weight-display hidden">
                    <span>当前干体重</span>
                    <strong id="dryWeightValue">— kg</strong>
                    <button type="button" id="editDryWeightBtn" class="btn-edit-small">修改</button>
                </div>
            </div>

            <!-- 新增记录表单 -->
            <div class="card">
                <h2 class="card-title" id="formTitle">新增透析记录</h2>
                <form id="recordForm" class="record-form">
                    <div class="form-row">
                        <label for="recordDate">日期</label>
                        <input type="date" id="recordDate" required inputmode="none">
                    </div>
                    <div class="form-row">
                        <label for="dialysisType">透析类型</label>
                        <select id="dialysisType" required>
                            <option value="HD">HD（血液透析）</option>
                            <option value="HDF">HDF（血液透析滤过）</option>
                            <option value="HP">HP（血液灌流）</option>
                            <option value="HFHD">HFHD（高通量透析）</option>
                            <option value="PD">PD（腹膜透析）</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label for="preWeight">透前体重 (kg)</label>
                        <input type="number" id="preWeight" step="0.1" min="20" max="200" placeholder="如: 65.5" required inputmode="decimal" enterkeyhint="next">
                        <span id="gainRateHint" class="gain-rate-hint"></span>
                    </div>
                    <div class="form-row">
                        <label for="clothesWeight">衣服重量 (kg) <small style="font-weight:400;color:var(--text-light)">选填，用于扣除计算涨水率</small></label>
                        <input type="number" id="clothesWeight" step="0.1" min="0" max="20" placeholder="如: 1.5" inputmode="decimal" enterkeyhint="next">
                    </div>
                    <div class="form-row">
                        <label for="postWeight">透后体重 (kg) <small style="font-weight:400;color:var(--text-light)">选填，下机后补填</small></label>
                        <input type="number" id="postWeight" step="0.1" min="20" max="200" placeholder="下机后填写" inputmode="decimal" enterkeyhint="next">
                    </div>
                    <div class="form-row">
                        <label for="fluidRemoved">减水量 (mL) <small style="font-weight:400;color:var(--text-light)">选填，下机后补填</small></label>
                        <input type="number" id="fluidRemoved" step="50" min="0" max="5000" placeholder="下机后填写" inputmode="numeric" enterkeyhint="next">
                    </div>
                    <div class="form-row">
                        <label for="notes">备注</label>
                        <textarea id="notes" rows="2" placeholder="如有不适症状等可记录" enterkeyhint="done"></textarea>
                    </div>
                    <p class="form-tip">💡 可先保存透前数据，下机后再编辑补填透后体重和减水量</p>
                    <button type="submit" class="btn-primary">保存记录</button>
                    <button type="button" id="cancelEditBtn" class="btn-cancel hidden">取消编辑</button>
                </form>
            </div>

            <!-- 记录列表 -->
            <div class="card">
                <div class="card-header-row">
                    <h2 class="card-title">历史记录</h2>
                    <span id="recordCount" class="badge">0 条</span>
                </div>
                <div id="recordList" class="record-list">
                    <p class="empty-hint">暂无记录，开始添加第一条吧</p>
                </div>
            </div>
        </section>

        <!-- Tab 2: 统计 -->
        <section id="tab-stats" class="tab-page">
            <!-- 月份选择器 -->
            <div class="card">
                <div class="month-selector">
                    <button type="button" id="statsPrevMonth" class="month-nav-btn" aria-label="上个月">‹</button>
                    <span id="statsMonthLabel" class="month-label">2026年8月</span>
                    <button type="button" id="statsNextMonth" class="month-nav-btn" aria-label="下个月">›</button>
                </div>
            </div>

            <!-- 概览卡片 -->
            <div class="stats-overview">
                <div class="stat-card">
                    <span class="stat-value" id="monthDialysisCount">0</span>
                    <span class="stat-label">本月透析</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="monthAvgFluid">0 mL</span>
                    <span class="stat-label">平均减水</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="monthAvgGainRate">—</span>
                    <span class="stat-label">平均涨水率</span>
                </div>
            </div>

            <!-- 体重趋势 -->
            <div class="card">
                <h2 class="card-title">体重变化趋势</h2>
                <div class="chart-container">
                    <canvas id="weightChart"></canvas>
                </div>
            </div>

            <!-- 减水量趋势 -->
            <div class="card">
                <h2 class="card-title">减水量趋势</h2>
                <div class="chart-container">
                    <canvas id="fluidChart"></canvas>
                </div>
            </div>

            <!-- 透析类型占比 -->
            <div class="card">
                <h2 class="card-title">透析类型占比</h2>
                <div class="chart-container">
                    <canvas id="typeChart"></canvas>
                </div>
            </div>
        </section>

        <!-- Tab 3: 钾/磷含量食物 -->
        <section id="tab-foods" class="tab-page">
            <div class="card">
                <!-- 矿物质切换：钾 / 磷 -->
                <div class="mineral-switch" id="mineralSwitch">
                    <button type="button" class="mineral-switch-btn active" data-mineral="k">钾含量</button>
                    <button type="button" class="mineral-switch-btn" data-mineral="p">磷含量</button>
                </div>
                <h2 class="card-title" id="foodCardTitle">钾含量食物参考</h2>
                <p class="food-intro" id="foodIntro">
                    透析患者需控制钾摄入，每日建议 <strong>2-3g</strong> 钾。
                </p>
                <p class="food-disclaimer" id="foodDisclaimer">仅供参考，具体以实际食物钾含量为准</p>
                <div class="food-search-box">
                    <input type="text" id="foodSearch" placeholder="搜索食物名称，如：香蕉、菠菜..." autocomplete="off" inputmode="search" enterkeyhint="search">
                    <span class="food-search-icon">🔍</span>
                </div>
                <div id="foodSearchResult" class="food-search-result"></div>
                <div class="food-tabs" id="foodLevelTabs">
                    <button class="food-tab-btn active" data-level="low">
                        <span class="food-tab-icon green"></span><span class="food-tab-label">低钾</span>
                        <small class="food-tab-range">&lt;150mg</small>
                    </button>
                    <button class="food-tab-btn" data-level="mid">
                        <span class="food-tab-icon yellow"></span><span class="food-tab-label">中钾</span>
                        <small class="food-tab-range">150-250mg</small>
                    </button>
                    <button class="food-tab-btn" data-level="high">
                        <span class="food-tab-icon red"></span><span class="food-tab-label">高钾</span>
                        <small class="food-tab-range">&gt;250mg</small>
                    </button>
                </div>
                <div id="foodList" class="food-list"></div>
                <p class="food-source" id="foodSource">数据来源：《中国食物成分表·标准版（第6版）》+ 武汉第三医院/复旦中山医院透析患者饮食指南</p>
            </div>
        </section>

        <!-- Tab 5: 任务管理 -->
        <section id="tab-tasks" class="tab-page">
            <div class="card">
                <h2 class="card-title">任务管理</h2>
                <form id="taskForm" class="task-form">
                    <input type="text" id="taskInput" placeholder="输入任务名称..." maxlength="50" required inputmode="text" enterkeyhint="done">
                    <button type="submit" class="btn-primary">添加</button>
                </form>
                <div id="taskList" class="task-list">
                    <p class="empty-hint">暂无任务</p>
                </div>
            </div>
        </section>

    </main>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-tab="records">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7 17v-2h6v2H7zm10 0h-2v-2h2v2zm0-4H7v-2h10v2z"/>
            </svg>
            <span>记录</span>
        </button>
        <button class="nav-btn" data-tab="stats">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M3.5 18.5l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 17l1.5 1.5z"/>
            </svg>
            <span>统计</span>
        </button>
        <button class="nav-btn" data-tab="foods">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/>
            </svg>
            <span>食物</span>
        </button>
        <button class="nav-btn" data-tab="tasks">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
            </svg>
            <span>任务</span>
        </button>
    </nav>

    <!-- Toast 提示 -->
    <div id="toast" class="toast"></div>

    <script src="js/foods.js" defer></script>
    <script src="js/tasks.js" defer></script>
    <script src="js/records.js" defer></script>
    <script src="js/stats.js" defer></script>
    <script src="js/app.js" defer></script>
</body>
</html>
